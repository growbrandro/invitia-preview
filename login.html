<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autentificare — INVITIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-ivory text-ink min-h-screen">
  <header class="px-4 py-4 max-w-6xl mx-auto"><a href="index.html" class="font-display text-2xl">INVITIA</a></header>
  <main class="max-w-md mx-auto px-4 py-16">
    <h1 class="font-display text-4xl">Intră în cont</h1>
    <p class="font-sans text-sm text-[#5c5148] mt-2">De aici îți redeschizi invitațiile oricând.</p>
    <form id="login-form" class="mt-8 space-y-4 font-sans">
      <label class="block text-sm">Email
        <input type="email" required name="email" class="field mt-1" />
      </label>
      <label class="block text-sm">Parolă
        <input type="password" required name="password" minlength="6" class="field mt-1" />
      </label>
      <p id="err" class="hidden text-sm text-red-700"></p>
      <button class="btn-gold w-full py-3 rounded-full" type="submit">Autentificare</button>
    </form>
    <p class="font-sans text-sm mt-6">Nu ai cont? <a href="register.html" class="underline decoration-gold">Creează unul</a></p>
  </main>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = fd.get("email");
      const password = fd.get("password");
      const users = JSON.parse(localStorage.getItem("invitia_users") || "[]");
      const found = users.find((u) => u.email === email && u.password === password);
      const err = document.getElementById("err");
      if (!found) {
        err.textContent = "Email sau parolă incorecte.";
        err.classList.remove("hidden");
        return;
      }
      Invitia.setUser({ email: found.email, name: found.name });
      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
